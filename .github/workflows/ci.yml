name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: gates (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Offline gate
        run: npm test
      - name: Host and registry smoke
        run: node tests/host-smoke.mjs && node tests/registry-smoke.mjs
      - name: Demo browser smoke
        run: npm run smoke:demo
      - name: Release consistency (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash tools/check-release.sh
